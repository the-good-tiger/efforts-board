name: Process Daily Log

on:
  issues:
    types: [opened, edited]

jobs:
  process:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.issue.labels.*.name, 'log') ||
      contains(github.event.issue.title, 'Daily Log') ||
      github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: write
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub CLI
        run: |
          gh auth setup-git
          gh auth status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          # REMOVE the cache option since we don't have requirements.txt/pyproject.toml
          # cache: 'pip'  # This line causes the error
      - name: Install jq
        run: sudo apt-get install -y jq
        
      - name: Process new log entry
        # Issue title and body are attacker-controlled: anyone can open an issue
        # on a public repository, and the `if` guard above passes on a title the
        # attacker writes. Interpolating `${{ ... }}` directly into `run:` pastes
        # that text into the script before the shell parses it, so a quote or a
        # `$(...)` in an issue executes here -- with the `contents: write` token
        # this job is granted. Passing the values through `env` instead means the
        # shell expands them as data and never parses them as code.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Create a temporary file with the issue body content
          printf '%s' "$ISSUE_BODY" > /tmp/issue_body.txt

          python .github/scripts/process_data.py \
          "$ISSUE_TITLE" \
          /tmp/issue_body.txt \
          "$ISSUE_NUMBER"

      - name: Commit and push updated data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data.json
          git commit -m "CI: Update data from issue $ISSUE_NUMBER"
          git push
        env:
          # An integer, so not injectable -- but read from the environment for
          # the same reason as above, so the pattern is uniform in this file.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
